<title>Celoteh Orang Tua · Link</title>
<meta name="description" content="Rekomendasi & link pilihan dari @celotehorangtua">

<style>
  :root{--bg:#FAF8F2;--ink:#242228;--muted:#6b6670;--card:#fff;--accent:#F08A34;--line:#efe8dc}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;min-height:100vh}
  .wrap{max-width:480px;margin:0 auto;padding:40px 16px 48px}
  header{text-align:center;margin-bottom:28px}
  header img{width:96px;height:96px;border-radius:50%;box-shadow:0 2px 10px rgba(0,0,0,.1)}
  h1{font-size:20px;font-weight:800;margin-top:12px}
  .bio{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.5}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:24px 4px 10px}
  a.card{display:block;border-radius:16px;overflow:hidden;margin-bottom:14px;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.08);transition:transform .15s}
  a.card:active{transform:scale(.98)}
  a.card img{display:block;width:100%;height:auto;background:var(--line)}
  .info{background:#1B4332;padding:12px 14px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
  .d{color:#d6e2da;font-size:13px;line-height:1.45}
  .btn{display:inline-block;padding:8px 16px;border-radius:99px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,138,52,.5)}50%{box-shadow:0 0 0 8px rgba(240,138,52,0)}}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:32px}
  footer a{color:var(--accent);text-decoration:none;font-weight:700}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.png" alt="Celoteh Orang Tua">
    <h1>Celoteh Orang Tua</h1>
    <p class="bio">Cerita & ilmu parenting sehari-hari.<br>Ini rekomendasi pilihan kami 👇</p>
  </header>
  <main id="list"></main>
  <footer><a href="https://instagram.com/celotehorangtua">@celotehorangtua</a></footer>
</div>
<script>
// ===== TAMBAH LINK DI SINI =====
// section: nama grup (link dengan section sama dikumpulin jadi satu)
// content_name: ID unik buat tracking (Pixel KlikLinkBio {content_name}; GA4 nama event = content_name), huruf kecil_underscore
const LINKS = [
  {
    section: "Produk Kami",
    content_name: "amplop_custom",
    desc: "Amplop Lebaran custom bergambar ilustrasi keluargamu sendiri. Lebih unik, spesial, dan beda dari yang lain.",
    cta: "Pesan Sekarang",
    url: "https://celotehorangtua.myscalev.com/amplop-lebaran-v2",
    img: "https://cdn.jsdelivr.net/gh/Highly-Needed/celoteh-assets@v2/og-amplop.jpg"
  },
  {
    section: "Rekomendasi",
    content_name: "kurikulum_internasional",
    desc: "6 kurikulum kelas dunia (Montessori, Cambridge, Finlandia, Reggio Emilia, Waldorf, Singapore Math) dalam 1 paket + toolkit siap pakai. Cukup Rp99.000, sekali bayar selamanya.",
    cta: "Lihat Paketnya",
    url: "https://lynk.id/kahaya/w37lwmxoeg41",
    img: "https://cdn.lynkid.my.id/products/09-06-2026/1780982358268_5120930.png"
  },
  {
    section: "Rekomendasi",
    content_name: "buku_kenali_emosi",
    desc: "Buku cerita & aktivitas buat si Kecil 3+ tahun: kenali 10+ emosi lewat lift-the-flap, sliding, dan roda putar. Dikembangkan bareng dokter & psikolog anak.",
    cta: "Cek di Shopee",
    url: "https://s.shopee.co.id/1gKFJqLGBf",
    img: "img/buku-kenali-emosi.jpg",
    noUtm: true // link affiliate Shopee, jangan ditambah UTM
  },
  {
    section: "Rekomendasi",
    content_name: "buku_101_kata_pertamaku",
    desc: "Board book 101+ kata pertama buat si Kecil 1-3 tahun: 14 tema sehari-hari, lift-the-flap + cermin. Bantu stimulasi bicara, dikembangkan bareng dokter & psikolog anak.",
    cta: "Cek di Shopee",
    url: "https://s.shopee.co.id/20x5ogHIk3",
    img: "img/buku-101-kata.jpg?v=2",
    noUtm: true
  },
  {
    section: "Rekomendasi",
    content_name: "buku_dunia_hewan",
    desc: "Board book 120+ hewan dari seluruh dunia pakai foto asli, kosakata dua bahasa, lift-the-flap. Buat si Kecil 1-3 tahun, dikembangkan bareng dokter & psikolog anak.",
    cta: "Cek di Shopee",
    url: "https://s.shopee.co.id/7puslRksQ1",
    img: "img/buku-dunia-hewan.jpg",
    noUtm: true
  },
];
// ================================

const UTM = "utm_source=instagram&utm_medium=linkbio";
const list = document.getElementById("list");
const groups = {};
LINKS.forEach(l => (groups[l.section] ||= []).push(l));
for (const [sec, items] of Object.entries(groups)) {
  const h = document.createElement("h2"); h.textContent = sec; list.appendChild(h);
  items.forEach(l => {
    const a = document.createElement("a");
    a.className = "card"; a.target = "_blank"; a.rel = "noopener";
    a.href = l.noUtm ? l.url : l.url + (l.url.includes("?") ? "&" : "?") + UTM;
    a.innerHTML = `${l.img ? `<img src="${l.img}" alt="">` : ""}
      <div class="info">${l.desc ? `<div class="d">${l.desc}</div>` : ""}<span class="btn">${l.cta || "Lihat Sekarang"} 👉</span></div>`;
    a.addEventListener("click", () => {
      const p = { content_name: l.content_name, content_category: l.section };
      try { fbq("trackCustom", "KlikLinkBio", p); } catch (e) {}
      try { gtag("event", l.content_name, { ...p, link_url: l.url, transport_type: "beacon" }); } catch (e) {}
    });
    list.appendChild(a);
  });
}
</script>
</body>
</html>
