<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celoteh Orang Tua · Link</title>
<meta name="description" content="Rekomendasi & link pilihan dari @celotehorangtua">
<link rel="icon" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FAF8F2;--ink:#242228;--muted:#6b6670;--card:#fff;--accent:#F08A34;--line:#efe8dc}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;min-height:100vh}
  .wrap{max-width:480px;margin:0 auto;padding:40px 16px 48px}
  header{text-align:center;margin-bottom:28px}
  header img{width:88px;height:88px;border-radius:50%;background:#fff;border:3px solid var(--accent);padding:8px}
  h1{font-size:20px;font-weight:800;margin-top:12px}
  .bio{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.5}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:24px 4px 10px}
  a.card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px;text-decoration:none;color:inherit;transition:transform .15s}
  a.card:active{transform:scale(.98)}
  a.card img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--line)}
  .t{font-weight:700;font-size:15px;line-height:1.3}
  .d{color:var(--muted);font-size:13px;margin-top:2px}
  .tag{display:inline-block;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;margin-bottom:4px}
  .arrow{margin-left:auto;color:var(--accent);font-weight:800;padding-right:6px}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:32px}
  footer a{color:var(--accent);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.svg" alt="Celoteh Orang Tua">
    <h1>Celoteh Orang Tua</h1>
    <p class="bio">Cerita & ilmu parenting sehari-hari.<br>Ini rekomendasi pilihan kami 👇</p>
  </header>
  <main id="list"></main>
  <footer><a href="https://instagram.com/celotehorangtua">@celotehorangtua</a></footer>
</div>
<script>
// ===== TAMBAH LINK DI SINI =====
// section: nama grup (link dengan section sama dikumpulin jadi satu)
const LINKS = [
  {
    section: "Produk Kami",
    title: "Amplop Custom Ilustrasi Keluarga",
    desc: "Amplop THR bergambar keluargamu sendiri",
    tag: "Lebaran 1448 H",
    url: "https://celotehorangtua.myscalev.com/amplop-lebaran-v2",
    img: "https://cdn.jsdelivr.net/gh/Highly-Needed/celoteh-assets@v3/hero-amplop.webp"
  },
];
// ================================

const UTM = "utm_source=instagram&utm_medium=linkbio";
const list = document.getElementById("list");
const groups = {};
LINKS.forEach(l => (groups[l.section] ||= []).push(l));
for (const [sec, items] of Object.entries(groups)) {
  const h = document.createElement("h2"); h.textContent = sec; list.appendChild(h);
  items.forEach(l => {
    const a = document.createElement("a");
    a.className = "card"; a.target = "_blank"; a.rel = "noopener";
    a.href = l.url + (l.url.includes("?") ? "&" : "?") + UTM;
    a.innerHTML = `${l.img ? `<img src="${l.img}" alt="">` : ""}
      <div>${l.tag ? `<span class="tag">${l.tag}</span>` : ""}
      <div class="t">${l.title}</div>${l.desc ? `<div class="d">${l.desc}</div>` : ""}</div>
      <span class="arrow">›</span>`;
    list.appendChild(a);
  });
}
</script>
</body>
</html>
